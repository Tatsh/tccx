concurrency:
  cancel-in-progress: true
  group: '${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}'
jobs:
  analyze:
    name: 'Analyze'
    permissions:
      actions: 'read'
      contents: 'read'
      security-events: 'write'
    runs-on: 'macos-15'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          persist-credentials: false
      - name: 'Initialize CodeQL'
        uses: 'github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2' # v4.38.2
        with:
          languages: '${{ matrix.language }}'
      - name: 'Autobuild'
        uses: 'github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2' # v4.38.2
      - name: 'Perform CodeQL Analysis'
        uses: 'github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2' # v4.38.2
        with:
          category: '/language:${{ matrix.language }}'
    strategy:
      fail-fast: false
      matrix:
        language:
          - 'actions'
          - 'swift'
name: 'CodeQL'
'on':
  pull_request:
    branches:
      - 'master'
    paths:
      - '**/*.swift'
      - '**/action.yaml'
      - '**/action.yml'
      - '.github/workflows/*.yaml'
      - '.github/workflows/*.yml'
  push:
    branches:
      - 'master'
    paths:
      - '**/*.swift'
      - '**/action.yaml'
      - '**/action.yml'
      - '.github/workflows/*.yaml'
      - '.github/workflows/*.yml'
  schedule:
    - cron: '15 4 * * 3'
permissions: {}
