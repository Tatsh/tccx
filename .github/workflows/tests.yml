jobs:
  test:
    env:
      # Allow the Coveralls action's Homebrew tap to install without a trust prompt.
      HOMEBREW_NO_REQUIRE_TAP_TRUST: '1'
    name: 'Test + coverage'
    runs-on: 'macos-14'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          persist-credentials: false
      - name: 'Show Swift version'
        run: 'swift --version'
      - name: 'Run tests with coverage'
        run: 'swift test --enable-code-coverage'
      - name: 'Export lcov'
        run: |
          bin="$(swift build --show-bin-path)"
          prof="$bin/codecov/default.profdata"
          xctest="$(find "$bin" -name '*.xctest' -maxdepth 1 | head -1)"
          exe="$xctest/Contents/MacOS/$(basename "$xctest" .xctest)"
          xcrun llvm-cov report "$exe" -instr-profile "$prof" \
            -ignore-filename-regex='(Tests|\.build)/'
          xcrun llvm-cov export -format=lcov "$exe" -instr-profile "$prof" \
            -ignore-filename-regex='(Tests|\.build)/' > coverage.lcov
      - name: 'Upload coverage to Coveralls'
        uses: 'coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329' # v2.3.8
        with:
          file: 'coverage.lcov'
          format: 'lcov'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
name: 'tests'
'on':
  pull_request:
  push:
    branches:
      - 'master'
  workflow_dispatch:
permissions:
  contents: 'read'
